# publish-npm.yml — publish @aiti-ai/ddns to the npm official registry
# (registry.npmjs.org). Single-package variant of the aiti-ai/aiti-ai
# publish-npm.yml decision matrix: this repo ships one package, so the
# content-hash skip / auto-bump machinery is unnecessary — the version is
# bumped manually on release.
#
# Trigger: workflow_dispatch (manual)
#   dry_run: true (default) — preflight + typecheck + tests + build + pack
#   verification (dist present, no test/mocks leakage into the tarball);
#   false — publish for real.
#
# Auth: NPM_TOKEN secret (granular automation token with packages read/write
# on the @aiti-ti scope — note: the @aiti-ai-scope token used by the other
# repos does NOT cover this package).
# Upgrade path (token-free): npmjs Trusted Publishing (OIDC) — bind the
# package on npmjs.com to this repo + workflow file, then publish with
# --provenance and drop the NPM_TOKEN env. Kept as a comment until the
# package exists on npmjs (first publish still needs a token).

name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (preflight + tests + build + pack verification, no publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write # npm provenance (official publishes carry --provenance once Trusted Publishing is bound)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org" # writes ~/.npmrc with NODE_AUTH_TOKEN
          cache: npm

      - name: Preflight — registry identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      # mocks/ is a file:-protocol devDependency shipped in-repo — npm ci resolves it locally.
      - name: Install deps
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (all green or no publish)
        run: npm test

      # dist/ is gitignored — the tarball can only ship what CI builds here.
      - name: Build
        run: npm run build

      - name: Pack — verify tarball contents (dist + src + docs present, no test/mocks leakage)
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].files.map(f => f.path);
            const mustHave = ['package/dist/index.js', 'package/dist/index.d.ts', 'package/src/index.ts', 'package/README.md'];
            const missing = mustHave.filter(f => !files.includes(f));
            if (missing.length) { console.error('missing from tarball: ' + missing.join(', ')); process.exit(1); }
            const leaked = files.filter(f => f.startsWith('package/test/') || f.startsWith('package/mocks/'));
            if (leaked.length) { console.error('internal paths leaked into the tarball: ' + leaked.join(', ')); process.exit(1); }
            console.log('tarball ok: ' + files.length + ' files');
          "

      - name: Publish
        if: ${{ inputs.dry_run == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Trusted Publishing upgrade: drop NODE_AUTH_TOKEN, add --provenance
        run: npm publish --access public

      - name: Summary
        run: |
          echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_STEP_SUMMARY"
